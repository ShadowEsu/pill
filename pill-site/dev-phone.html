<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dev: phone</title>
  <link rel="stylesheet" href="/src/styles.css">
  <style>
    body { margin: 0; background: var(--dark); color: var(--dark-text); font-family: var(--mono); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; }
    .bar button { font: inherit; font-size: 12px; padding: 6px 10px; background: #1a1d21; color: inherit; border: 1px solid var(--dark-line); border-radius: 6px; cursor: pointer; }
    .stage { display: flex; gap: 48px; align-items: flex-start; padding: 40px 60px 60px; }
    #phone { width: 390px; }
    .three { display: flex; gap: 56px; justify-content: center; padding: 56px 40px 64px; }
    .three > div { width: 300px; }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <button id="play">play()</button>
    <button id="pause">pause()</button>
  </div>
  <div class="stage">
    <div id="shot" style="padding:56px"><div id="phone"></div></div>
  </div>
  <div class="three" id="three">
    <div id="p-verdict"></div>
    <div id="p-clinic"></div>
    <div id="p-personal"></div>
  </div>
  <script type="module">
    import { mountPhone, PHONE_STATES, PHONE_SEQUENCES } from '/src/phone.js';
    const big = mountPhone(document.getElementById('phone'), { caption: true });
    window.phone = big;
    const bar = document.getElementById('bar');
    for (const s of PHONE_STATES) {
      const b = document.createElement('button');
      b.textContent = s;
      b.dataset.s = s;
      b.onclick = () => big.setState(s);
      bar.insertBefore(b, document.getElementById('play'));
    }
    document.getElementById('play').onclick = () => big.play();
    document.getElementById('pause').onclick = () => big.pause();
    window.phones = ['verdict', 'clinic', 'personal'].map((k) =>
      mountPhone(document.getElementById(`p-${k}`), { sequence: PHONE_SEQUENCES[k], caption: true, autoplay: true }));
  </script>
</body>
</html>
