<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pill · demo film (seekable)</title>
<!--
  The whole film is a pure function of time: window.seek(t) computes every style from t.
  No CSS animations, no timers, nothing carried between frames. The app footage is a <video>
  seeked to (t - start) and awaited. render.mjs screenshots it frame by frame.
  Open directly in a browser and drag the scrubber at the bottom (hidden while rendering).
-->
<style>
  @font-face { font-family: 'Instrument Serif'; src: url(fonts/instrument-serif-400.woff2) format('woff2'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Instrument Serif'; src: url(fonts/instrument-serif-400-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
  @font-face { font-family: 'Inter'; src: url(fonts/inter-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Inter'; src: url(fonts/inter-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Inter'; src: url(fonts/inter-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-500.woff2) format('woff2'); font-weight: 500; }
  html, body { margin: 0; background: #F7F8F7; }
  #stage { position: relative; width: 1920px; height: 1080px; background: #F7F8F7; overflow: hidden; }
  #stage svg { position: absolute; left: 0; top: 0; }
  #app { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; visibility: hidden; }
  #scrub { width: 1920px; margin: 8px 0; }
  body.render #scrub, body.render #tc { display: none; }
  #tc { font: 14px 'JetBrains Mono', monospace; color: #16181B; padding: 0 8px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="under" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <video id="app" src="appcut.mp4" muted preload="auto" playsinline></video>
  <svg id="over" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
</div>
<input id="scrub" type="range" min="0" max="158" step="0.0333" value="0"><span id="tc"></span>
<script src="vo/timing.js"></script>
<script>
'use strict';
// ───────────────────────── constants ─────────────────────────
const DURATION = 158;
window.DURATION = DURATION;
window.FPS = 30;
const C = {
  paper: '#F7F8F7', ink: '#16181B', sky: '#4FB3FF', mint: '#5FD39A', amber: '#E09A3A',
  violet: '#7A5CFF', navy: '#0E1216', mute: '#6B7177', rule: '#DADFE3', grid: '#E6E9EB', white: '#FFFFFF',
};
const F = { serif: "'Instrument Serif', serif", sans: "'Inter', sans-serif", mono: "'JetBrains Mono', monospace" };
// Scene windows (seconds). Each scene owns its own entrance and hands its shapes to the next one.
const SCENES = [
  { id: 'moment',  t0: 0,     t1: 22.5,  label: 'THE MOMENT',       chips: [['REPLAY · SYNTHETIC CURVE TM-02', C.sky]] },
  { id: 'problem', t0: 22.5,  t1: 39.5,  label: 'THE PROBLEM',      chips: [] },
  { id: 'box',     t0: 39.5,  t1: 51.5,  label: 'THE BOX',          chips: [['STATION · BEING BUILT', C.amber]] },
  { id: 'words',   t0: 51.5,  t1: 62.5,  label: 'THREE ANSWERS',    chips: [] },
  { id: 'app',     t0: 62.5,  t1: 87,    label: 'THE APP',          chips: [] },
  { id: 'rail',    t0: 87,    t1: 102,   label: 'CLINIC MODE',      chips: [['SANDBOX / TESTNET', C.sky]] },
  { id: 'x402',    t0: 102,   t1: 123,   label: 'x402 · COINBASE',  chips: [['TESTNET · BASE SEPOLIA', C.violet]] },
  { id: 'honest',  t0: 123,   t1: 141,   label: 'WHAT IS REAL',     chips: [] },
  { id: 'figma',   t0: 141,   t1: 151,   label: 'WORKFLOW',         chips: [] },
  { id: 'end',     t0: 151,   t1: 158,   label: '',                 chips: [] },
];
window.SCENES = SCENES;
// Footage: appcut.mp4 (22.0 s) = TM-02 run at 2x → Done + NEEDS LAB → B2-07 PASS → d-1041 hold-to-release.
const APP_IN = 63.5, APP_LEN = 22.0;
const FRAME = { x: 326, y: 112, w: 1267, h: 792, r: 14 };

// caption timing from vo/timing.js (generated by vo.mjs from the actual audio)
const VO = window.VO || [];
const cap = (id, i) => { const v = VO.find((x) => x.id === id); return v ? v.captions[i].s : 0; };

// ───────────────────────── time helpers ─────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, d) => clamp((t - a) / d);
// critically damped spring: no overshoot, settles in d seconds
const sp = (t, a, d = 0.7) => { const x = (t - a) / d; if (x <= 0) return 0; if (x >= 1) return 1; const k = 6; return (1 - (1 + k * x) * Math.exp(-k * x)) / (1 - (1 + k) * Math.exp(-k)); };
// exponential ease-out
const ex = (t, a, d = 0.6) => { const x = seg(t, a, d); return (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10)); };
// cubic in-out for shape morphs
const io = (t, a, d = 0.8) => { const p = seg(t, a, d); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const r2 = (n) => Math.round(n * 100) / 100;
const mix = (c1, c2, p) => { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16); const ch = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, p)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };
const hash = (i, j) => { let h = (i * 374761393 + j * 668265263) ^ 0x5bd1e995; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// ───────────────────────── svg helpers ─────────────────────────
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const measureCtx = document.createElement('canvas').getContext('2d');
const tw = (s, size, font = 'sans', weight = 400, italic = false) => { measureCtx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${F[font]}`; return measureCtx.measureText(s).width; };
function T(x, y, s, o = {}) {
  const { size = 24, font = 'sans', fill = C.ink, anchor = 'start', op = 1, weight = 400, ls = 0, italic = false, tr = '' } = o;
  if (op <= 0.002 || s === '') return '';
  return `<text x="${r2(x)}" y="${r2(y)}" font-family="${F[font]}" font-size="${r2(size)}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}"${op < 1 ? ` opacity="${r2(op)}"` : ''}${ls ? ` letter-spacing="${ls}"` : ''}${italic ? ' font-style="italic"' : ''}${tr ? ` transform="${tr}"` : ''}>${esc(s)}</text>`;
}
function R(x, y, w, h, o = {}) {
  const { r = 0, fill = 'none', stroke = 'none', sw = 1, op = 1, dash = '', fop = 1 } = o;
  if (op <= 0.002 || w <= 0.2 || h <= 0.2) return '';
  return `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" rx="${r2(Math.min(r, w / 2, h / 2))}" fill="${fill}"${fop < 1 ? ` fill-opacity="${r2(fop)}"` : ''} stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}${op < 1 ? ` opacity="${r2(op)}"` : ''}/>`;
}
function L(x1, y1, x2, y2, o = {}) {
  const { stroke = C.ink, sw = 2, op = 1, dash = '', off = 0, cap = 'round' } = o;
  if (op <= 0.002) return '';
  return `<line x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="${cap}"${dash ? ` stroke-dasharray="${dash}" stroke-dashoffset="${r2(off)}"` : ''}${op < 1 ? ` opacity="${r2(op)}"` : ''}/>`;
}
function P(d, o = {}) {
  const { stroke = 'none', sw = 2, fill = 'none', op = 1, dash = '', fop = 1, join = 'round' } = o;
  if (op <= 0.002) return '';
  return `<path d="${d}" fill="${fill}"${fop < 1 ? ` fill-opacity="${r2(fop)}"` : ''} stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="${join}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}${op < 1 ? ` opacity="${r2(op)}"` : ''}/>`;
}
const G = (inner, tr = '', op = 1) => (op <= 0.002 || !inner ? '' : `<g${tr ? ` transform="${tr}"` : ''}${op < 1 ? ` opacity="${r2(op)}"` : ''}>${inner}</g>`);
// scale about a point
const SAt = (x, y, s, sy = s) => `translate(${r2(x)} ${r2(y)}) scale(${r2(Math.max(s, 0.0001))} ${r2(Math.max(sy, 0.0001))}) translate(${r2(-x)} ${r2(-y)})`;
// rounded polygon (cubic corners; k = 0.5523 makes right-angle corners circular). Morphs cleanly between shapes with equal vertex counts.
function roundPoly(pts, r) {
  const n = pts.length; let d = '';
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    const l1 = Math.hypot(p0[0] - p1[0], p0[1] - p1[1]) || 1, l2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) || 1;
    const rr = Math.min(r, l1 / 2, l2 / 2), k = 0.5523;
    const a = [p1[0] + (p0[0] - p1[0]) * rr / l1, p1[1] + (p0[1] - p1[1]) * rr / l1];
    const b = [p1[0] + (p2[0] - p1[0]) * rr / l2, p1[1] + (p2[1] - p1[1]) * rr / l2];
    const c1 = [a[0] + (p1[0] - a[0]) * k, a[1] + (p1[1] - a[1]) * k], c2 = [b[0] + (p1[0] - b[0]) * k, b[1] + (p1[1] - b[1]) * k];
    d += `${i ? 'L' : 'M'}${r2(a[0])} ${r2(a[1])}C${r2(c1[0])} ${r2(c1[1])} ${r2(c2[0])} ${r2(c2[1])} ${r2(b[0])} ${r2(b[1])}`;
  }
  return d + 'Z';
}
const trap = (cx, top, bot, wT, wB) => [[cx - wT / 2, top], [cx + wT / 2, top], [cx + wB / 2, bot], [cx - wB / 2, bot]];
// capsule centred at (cx,cy), length len, thickness th, rotated deg
function capsule(cx, cy, len, th, deg, o = {}) {
  const { fill = C.white, stroke = C.ink, sw = 2.5, seam = true, half = null, op = 1 } = o;
  const d = roundPoly([[cx - len / 2, cy - th / 2], [cx + len / 2, cy - th / 2], [cx + len / 2, cy + th / 2], [cx - len / 2, cy + th / 2]], th / 2);
  let s = '';
  if (half) { // two-colour capsule like the app's mark
    const id = `cl${Math.round(cx)}_${Math.round(cy)}`;
    s += `<clipPath id="${id}"><path d="${d}"/></clipPath>`;
    s += `<g clip-path="url(#${id})">${R(cx - len / 2, cy - th / 2, len / 2, th, { fill: half[0] })}${R(cx, cy - th / 2, len / 2, th, { fill: half[1] })}</g>`;
    s += P(d, { stroke, sw });
  } else s += P(d, { fill, stroke, sw });
  if (seam && len > th * 1.4) s += L(cx, cy - th / 2 + sw / 2, cx, cy + th / 2 - sw / 2, { stroke, sw: Math.max(1, sw * 0.7) });
  return G(s, `rotate(${r2(deg)} ${r2(cx)} ${r2(cy)})`, op);
}
// chip: mono uppercase label with a coloured dot, in a hairline pill
function chip(x, y, label, o = {}) {
  const { dot = null, anchor = 'start', op = 1, size = 15, fill = C.white, ink = C.ink, stroke = C.rule } = o;
  if (op <= 0.002) return '';
  const w = label.length * (size * 0.6 + 0.6) + (dot ? 46 : 30), h = size * 2.1;
  const x0 = anchor === 'end' ? x - w : anchor === 'middle' ? x - w / 2 : x;
  let s = R(x0, y - h / 2, w, h, { r: h / 2, fill, stroke, sw: 1.2 });
  if (dot) s += `<circle cx="${r2(x0 + 17)}" cy="${r2(y)}" r="${r2(size * 0.3)}" fill="${dot}"/>`;
  s += T(x0 + (dot ? 31 : 15), y + size * 0.36, label, { size, font: 'mono', fill: ink, ls: 0.6 });
  return G(s, '', op);
}
// verdict stamp: serif word in a coloured outline with a light fill of the same colour
function stamp(cx, cy, word, color, o = {}) {
  const { size = 66, op = 1, sc = 1, padX = 46, h = size * 1.75, outline = false, sub = '' } = o;
  if (op <= 0.002) return '';
  const w = tw(word, size, 'serif') + padX * 2;
  let s = R(cx - w / 2, cy - h / 2, w, h, { r: 14, fill: outline ? 'none' : color, fop: 0.16, stroke: outline ? C.ink : color, sw: outline ? 1.4 : 3, dash: outline ? '6 7' : '', op: outline ? 0.5 : 1 });
  if (!outline) s += T(cx, cy + size * 0.32, word, { size, font: 'serif', anchor: 'middle' });
  if (sub && !outline) s += T(cx, cy + h / 2 + 30, sub, { size: 16, font: 'mono', anchor: 'middle', fill: C.mute });
  return G(s, SAt(cx, cy, sc), op);
}
const stampW = (word, size = 66, padX = 46) => tw(word, size, 'serif') + padX * 2;
// glyphs (line drawings in the app's hand)
function lockGlyph(cx, cy, s = 1, color = C.ink) {
  return G(R(cx - 18, cy - 4, 36, 28, { r: 5, stroke: color, sw: 2.4, fill: C.white }) +
    P(`M${cx - 11} ${cy - 4}V${cy - 13}a11 11 0 0 1 22 0V${cy - 4}`, { stroke: color, sw: 2.4 }) +
    `<circle cx="${cx}" cy="${cy + 8}" r="3" fill="${color}"/>`, SAt(cx, cy, s));
}
function houseGlyph(cx, cy, s = 1) {
  return G(P(`M${cx - 20} ${cy - 2}L${cx} ${cy - 20}L${cx + 20} ${cy - 2}V${cy + 20}H${cx - 20}Z`, { stroke: C.ink, sw: 2.4, fill: C.white }) +
    L(cx, cy - 2, cx, cy + 12, { sw: 2.4 }) + L(cx - 7, cy + 5, cx + 7, cy + 5, { sw: 2.4 }), SAt(cx, cy, s));
}
function truckGlyph(cx, cy, s = 1) {
  return G(R(cx - 24, cy - 14, 30, 24, { r: 3, stroke: C.ink, sw: 2.4, fill: C.white }) +
    P(`M${cx + 6} ${cy - 6}H${cx + 16}L${cx + 24} ${cy + 2}V${cy + 10}H${cx + 6}Z`, { stroke: C.ink, sw: 2.4, fill: C.white }) +
    `<circle cx="${cx - 14}" cy="${cy + 14}" r="5" fill="${C.white}" stroke="${C.ink}" stroke-width="2.4"/><circle cx="${cx + 14}" cy="${cy + 14}" r="5" fill="${C.white}" stroke="${C.ink}" stroke-width="2.4"/>`, SAt(cx, cy, s));
}

// ───────────────────────── scene 1 · the moment (0 – 23) ─────────────────────────
const CH = { x0: 840, x1: 1800, yb: 760, yt: 230 };
const vy = (v) => CH.yb - (v / 0.6) * (CH.yb - CH.yt);
const simS = (t) => 180 * seg(t, 2.4, 8.0);               // replay clock: 180 sim-seconds in 8 film-seconds
const Acurve = (s) => (s <= 0 ? 0 : 0.384 * (1 - Math.exp(-s / 42)) / (1 - Math.exp(-180 / 42)) + 0.0025 * Math.sin(s * 0.9) * Math.min(1, s / 20));
const Gcurve = (s) => (s <= 0 ? 0 : 0.012 * (1 - Math.exp(-s / 50)) + 0.0018 * Math.sin(s * 1.7 + 1) * Math.min(1, s / 20));
const sx = (s) => lerp(CH.x0, CH.x1, s / 180);
function curvePath(fn, s1) { let d = ''; for (let s = 0; s <= s1 + 0.001; s += 1.5) d += `${s ? 'L' : 'M'}${r2(sx(s))} ${r2(vy(fn(s)))}`; return d; }

function sMoment(t) {
  if (t > 23.4) return '';
  let s = '';
  const d = seg(t, 2.4, 8.0);                    // dissolution progress
  const m = io(t, 14.0, 1.0);                    // cup → amber capsule
  const wash = io(t, 14.4, 1.1);                 // amber fill rising
  const leave = io(t, 22.0, 0.6);                // left column labels fold into the capsule
  const fold = io(t, 22.0, 0.7);                 // chart folds onto its baseline
  const hand = io(t, 22.3, 0.9);                 // capsule → the 7th pill of the row
  const appear = ex(t, 0.05, 0.6);

  // ── light path, left column
  const kit = (1 - m);
  s += T(90, 250, 'LIGHT PATH', { size: 14, font: 'mono', fill: C.mute, ls: 2, op: appear * kit });
  const beamOp = appear * kit;
  if (beamOp > 0.01) {
    const off = -t * 40;
    s += L(178, 505, 238, 505, { stroke: C.sky, sw: 3, dash: '10 9', off, op: beamOp });
    s += L(244, 505, 516, 505, { stroke: C.sky, sw: 3, dash: '10 9', off, op: beamOp * lerp(0.6, 0.25, d) });
    s += L(524, 505, 632, 505, { stroke: C.sky, sw: 3, dash: '10 9', off, op: beamOp * lerp(1, 0.38, d) });
    s += G(R(88, 475, 90, 60, { r: 10, fill: C.white, stroke: C.ink, sw: 2 }) + T(133, 512, 'LED', { size: 18, font: 'mono', anchor: 'middle' }) + T(133, 562, '465 nm', { size: 14, font: 'mono', anchor: 'middle', fill: C.mute }), SAt(133, 505, kit), beamOp);
    s += G(R(636, 475, 112, 60, { r: 10, fill: C.white, stroke: C.ink, sw: 2 }) + T(692, 512, 'inline', { size: 18, font: 'mono', anchor: 'middle' }) + T(692, 562, `${Math.round(lerp(100, 38, d))} % light`, { size: 14, font: 'mono', anchor: 'middle', fill: C.mute }), SAt(692, 505, kit), beamOp);
    s += L(380, 646, 380, 712, { stroke: C.mute, sw: 1.5, dash: '3 6', op: beamOp * 0.7 });
    s += G(R(328, 714, 104, 54, { r: 10, fill: C.white, stroke: C.ink, sw: 2 }) + T(380, 748, '90°', { size: 18, font: 'mono', anchor: 'middle' }), SAt(380, 741, kit), beamOp);
    s += T(446, 748, 'glow · dark', { size: 15, font: 'mono', fill: C.ink, op: beamOp * ex(t, 12.3, 0.4) });
  }

  // ── the cup, which becomes the amber capsule
  if (hand < 1) {
    const top = lerp(330, 300, m), bot = lerp(640, 640, m), wT = lerp(290, 164, m), wB = lerp(222, 164, m), rr = lerp(10, 82, m);
    // morph further into a horizontal row pill during the hand-off
    const ccx = lerp(380, 960 + (6 - 4.5) * 150, hand), ccy = lerp((top + bot) / 2, 440, hand);
    const len = lerp(bot - top, 46, hand), th = lerp(wT, 112, hand);   // (vertical: len=height)
    const rot = lerp(0, 90, hand);
    const shape = roundPoly(trap(ccx, ccy - len / 2, ccy + len / 2, lerp(wT, th, hand), lerp(wB, th, hand)), lerp(rr, 23, hand));
    const id = 'cupclip';
    let inner = `<clipPath id="${id}"><path d="${shape}"/></clipPath><g clip-path="url(#${id})">`;
    // water + chalk cloud (fade as the capsule takes over)
    const waterTop = 375;
    inner += R(ccx - 200, waterTop, 400, 300, { fill: C.sky, fop: 0.14, op: 1 - m });
    inner += R(ccx - 200, waterTop, 400, 300, { fill: '#C4CACF', fop: 0.6 * d, op: 1 - m });
    const yW = lerp(ccy + len / 2, ccy - len / 2 - 4, wash);
    inner += R(ccx - 200, yW, 400, 400, { fill: C.amber, op: wash > 0 ? 1 : 0 });
    inner += '</g>';
    if (m < 0.6) { // ripple on the surface
      let rp = ''; for (let x = 245; x <= 515; x += 6) rp += `${x === 245 ? 'M' : 'L'}${x} ${r2(waterTop + 2.5 * Math.sin(x * 0.05 + t * 2.2))}`;
      inner += P(rp, { stroke: C.sky, sw: 2, op: (1 - m / 0.6) * 0.8 });
    }
    inner += P(shape, { stroke: C.ink, sw: 3 });
    if (wash > 0.9) inner += L(ccx - lerp(wT, th, hand) / 2 + 2, ccy, ccx + lerp(wT, th, hand) / 2 - 2, ccy, { stroke: C.ink, sw: 2, op: (wash - 0.9) * 10 });
    s += G(inner, hand > 0 ? `rotate(${r2(rot)} ${r2(ccx)} ${r2(ccy)})` : '');
  }
  // the quarter tablet: drops, sinks, shrinks
  if (t < 14.6) {
    const pd = seg(t, 0.35, 0.6), q = ex(t, 0.95, 1.4);
    const ty = t < 0.95 ? lerp(140, 375, pd * pd) : lerp(375, 598, q);
    const sc = (1 - 0.72 * d) * (1 - m);
    const R0 = 36, rot = -20 + 160 * q;
    const tab = `<path d="M0 0L${R0} 0A${R0} ${R0} 0 0 0 0 ${-R0}Z" fill="${C.white}" stroke="${C.ink}" stroke-width="2.6" stroke-linejoin="round"/>`;
    s += G(tab, `translate(380 ${r2(ty)}) rotate(${r2(rot)}) scale(${r2(Math.max(sc, 0.001))}) translate(${-R0 / 2} ${R0 / 2})`, seg(t, 0.3, 0.1));
    // one ripple ring where it enters the water
    const rg = seg(t, 0.95, 0.9);
    if (rg > 0 && rg < 1) s += `<ellipse cx="380" cy="376" rx="${r2(20 + 110 * rg)}" ry="${r2(4 + 8 * rg)}" fill="none" stroke="${C.sky}" stroke-width="2" opacity="${r2(1 - rg)}"/>`;
  }

  // ── left column: verdict, money, referral (fold into the capsule at 22.0)
  const lc = (inner) => G(inner, SAt(380, 470, 1 - leave), 1 - leave);
  s += lc(stamp(380, 742, 'NEEDS LAB', C.amber, { size: 58, sc: lerp(1.16, 1, ex(t, 14.9, 0.45)), op: ex(t, 14.9, 0.3) }));
  s += lc(T(380, 826, 'rule N2 · the 90° channel decided', { size: 16, font: 'mono', anchor: 'middle', fill: C.mute, op: ex(t, 15.5, 0.5) }));

function placeVideo(vs) {

  video.style.transform = `translate(${a.x}px, ${a.y}px) scale(${k}, ${a.h / 900})`;

    for (let b = 0; b < 2; b++) {

      const g = ctx.createGain(); g.gain.setValueAtTime(0, tb); g.gain.linearRampToValueAtTime(0.11, tb + 0.04); g.gain.exponentialRampToValueAtTime(0.0008, tb + bar * 0.95);
      o.connect(g); g.connect(master); o.start(tb); o.stop(tb + bar);
    }
    const pat = [0, 2, 1, 3, 2, 1, 3, 2];
    for (let k = 0; k < 8; k++) {
      const tk = t0 + k * beat; if (tk < 3) continue;
      const n = chord[pat[k] % chord.length] + 12;
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(n);
      const g = ctx.createGain(); g.gain.setValueAtTime(0, tk); g.gain.linearRampToValueAtTime(k % 2 ? 0.016 : 0.024, tk + 0.006); g.gain.exponentialRampToValueAtTime(0.0005, tk + 0.55);

    const g = ctx.createGain(); g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(0.05, tt + 0.003); g.gain.exponentialRampToValueAtTime(0.0004, tt + 0.07);

  out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);

};
window.wavChunk = (i, size) => window.__wav.slice(i * size, (i + 1) * size);

window.READY = (async () => {

    document.fonts.load("64px 'Instrument Serif'"), document.fonts.load("italic 48px 'Instrument Serif'"),
    document.fonts.load("400 24px 'Inter'"), document.fonts.load("500 24px 'Inter'"),
